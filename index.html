<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Virtual Try-On — Premium Dark</title>
  <style>
    :root {
      --bg: #050505;
      --bg-soft: #111;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --line: rgba(255, 255, 255, 0.2);
      --glass: rgba(255, 255, 255, 0.06);
      --glow: rgba(255, 255, 255, 0.22);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000000;
      color: var(--text);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    #bubbles-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      backdrop-filter: blur(2px);
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.6);
        opacity: 0;
      }
      25% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-10vh) scale(1.15);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 3;
      width: min(1180px, 92vw);
      margin: 0 auto;
      padding-bottom: 80px;
    }

    .hero {
      padding: 46px 0 20px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .brand img {
      width: min(380px, 72vw);
      height: auto;
      object-fit: contain;
      border: 0;
      background: transparent;
      padding: 0;
      filter: drop-shadow(0 8px 26px rgba(255, 255, 255, 0.2));
    }

    .hero-actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.18s ease, box-shadow 0.2s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-primary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06));
      border-color: rgba(255, 255, 255, 0.38);
    }

    .section-title {
      margin: 42px 0 20px;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--glow);
      border-color: rgba(255, 255, 255, 0.42);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.44);
      background: rgba(0, 0, 0, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .product-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      filter: grayscale(0.15);
    }

    .card-content {
      padding: 14px;
    }

    .card-content h3 {
      margin: 2px 0 6px;
      font-size: 18px;
    }

    .card-price {
      margin: 0;
      color: #fff;
      font-weight: 600;
    }

    .sizes {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .muted-block {
      margin-top: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--glass);
      padding: 22px;
    }

    .steps {
      margin: 10px 0 0;
      padding-left: 18px;
      color: #d0d0d0;
      line-height: 1.7;
    }

    .faq-item {
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .faq-item strong {
      display: block;
      margin-bottom: 6px;
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 18px;
      width: min(780px, 92vw);
      padding: 0;
      color: var(--text);
      background: linear-gradient(145deg, #111, #050505);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.75);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.72);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding: 18px;
    }


    .tryon-slot-img {
      width: 100%;
      height: 100%;
      min-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .upload-box {
      display: grid;
      gap: 8px;
    }

    .upload-box input {
      width: 100%;
      color: #dcdcdc;
    }

    .mock {
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7c7c7;
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
    }

    .progress {
      margin-top: 10px;
      height: 8px;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 58%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(195, 195, 195, 0.85));
    }

    .product-card.selected {
      border-color: rgba(255, 255, 255, 0.82);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22), 0 22px 42px rgba(0, 0, 0, 0.5);
    }

    .selection-panel {
      position: sticky;
      bottom: 18px;
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .selection-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .slot {
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 10px;
      color: #cfcfcf;
      min-height: 72px;
      font-size: 13px;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.03);
    }

    .two-slots {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }

    .cart-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slot strong {
      display: block;
      color: #f3f3f3;
      margin-bottom: 4px;
    }

    @media (max-width: 760px) {
      .hero {
        padding-top: 64px;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="bubbles-container" aria-hidden="true"></div>

  <div class="logo-mask" aria-hidden="true">
    <img src="logo.png" alt="">
  </div>

  <main class="page">
    <section class="hero">
      <div class="brand">
        <img src="logo.png" alt="Логотип магазина">
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="startTryOn">Открыть примерку</button>
        <a class="btn" href="#catalog">Каталог</a>
      </div>
    </section>

    <section class="muted-block">
      <h2 class="section-title" style="margin-top: 0;">Корзина</h2>
      <div id="cartList" class="steps">Корзина пуста</div>
    </section>

    <section id="catalog">
      <h2 class="section-title">Каталог</h2>
      <div class="catalog" id="catalogGrid"></div>
    </section>

    <section class="selection-panel" aria-live="polite">
      <strong>Комплект для примерки</strong>
      <div class="selection-grid two-slots">
        <div class="slot" id="slot-upper"><strong>Верх</strong>Не выбрано</div>
        <div class="slot" id="slot-bottom"><strong>Низ</strong>Не выбрано</div>
      </div>
      <span class="sizes" id="selectionHint">Режим 1 элемент: выберите верх или низ. Режим 2 элемента: верх + низ.</span>
      <div class="hero-actions" style="justify-content: flex-start; margin-top: 0;">
        <button class="btn btn-primary" id="openTryOn">Открыть примерку</button>
        <button class="btn" id="clearSelection">Сбросить выбор</button>
      </div>
    </section>
  </main>

  <dialog id="tryOnModal">
    <div class="modal-head">
      <strong>Примерка комплекта</strong>
      <button class="btn" id="closeModal">Закрыть</button>
    </div>
    <div class="modal-grid">
      <div>
        <div class="mock" id="modePreview">Выберите вещи в каталоге</div>
      </div>
      <div>
        <div class="mock" id="selectionPreview">Режим примерки ещё не определён</div>
        <button class="btn btn-primary" id="confirmTryOn" style="margin-top: 10px; width: 100%;">Подтвердить набор</button>
        <div class="progress" aria-label="Прогресс генерации"><span></span></div>
      </div>
      <div class="upload-box">
        <div class="mock" id="userPhotoPreview">Загрузите фото в полный рост</div>
        <input id="userPhotoInput" type="file" accept="image/*">
      </div>
    </div>
    <div style="padding: 0 18px 18px;">
      <button class="btn btn-primary" id="confirmTryOn" style="margin-top: 10px; width: 100%;">Подтвердить набор</button>
      <div class="progress" aria-label="Прогресс генерации"><span></span></div>
    </div>
  </dialog>

  <script src="products.js"></script>
  <script>
    const catalogGrid = document.getElementById('catalogGrid');
    const cartList = document.getElementById('cartList');
    const slotUpper = document.getElementById('slot-upper');
    const slotBottom = document.getElementById('slot-bottom');
    const selectionHint = document.getElementById('selectionHint');

    const selectedTryOn = { upper: null, bottom: null };
    const cart = [];

    const categoryMeta = {
      tops: { badge: 'Верх', basePrice: 5400, sizes: 'XS · S · M · L' },
      bottoms: { badge: 'Низ', basePrice: 6200, sizes: 'S · M · L' },
      outerwears: { badge: 'Верх', basePrice: 9800, sizes: 'M · L · XL' }
    };

    function toTitle(filePath) {
      const fileName = filePath.split('/').pop().replace(/\.[^.]+$/, '');
      return fileName
        .split('_')
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    function itemFromPath(category, path) {
      return { category, path, title: toTitle(path) };
    }

    function renderCatalog() {
      const entries = Object.entries(products || {});
      const cards = entries.flatMap(([category, items]) => {
        const meta = categoryMeta[category] || { badge: 'Товар', basePrice: 5000, sizes: 'S · M · L' };
        return items.map((filePath, index) => {
          const price = (meta.basePrice + index * 350).toLocaleString('ru-RU');
          return `
            <article class="product-card" data-category="${category}" data-path="${filePath}">
              <span class="badge">${meta.badge}</span>
              <img src="${filePath}" alt="${toTitle(filePath)}">
              <div class="card-content">
                <h3>${toTitle(filePath)}</h3>
                <p class="card-price">${price}₽</p>
                <p class="sizes">Размеры: ${meta.sizes}</p>
                <div class="card-actions">
                  <button class="btn btn-primary select-item">В примерку</button>
                  <button class="btn add-cart">В корзину</button>
                </div>
              </div>
            </article>
          `;
        });
      });

      catalogGrid.innerHTML = cards.join('');
    }

    function selectForTryOn(item) {
      const slot = item.category === 'bottoms' ? 'bottom' : 'upper';
      selectedTryOn[slot] = item;
      renderSelection();
    }

    function renderSelection() {
      slotUpper.innerHTML = `<strong>Верх</strong>${selectedTryOn.upper?.title || 'Не выбрано'}`;
      slotBottom.innerHTML = `<strong>Низ</strong>${selectedTryOn.bottom?.title || 'Не выбрано'}`;

      const count = [selectedTryOn.upper, selectedTryOn.bottom].filter(Boolean).length;
      if (count === 0) selectionHint.textContent = 'Режим 1 элемент: выберите верх или низ. Режим 2 элемента: верх + низ.';
      else if (count === 1) selectionHint.textContent = 'Готов режим «1 элемент». Можно продолжать.';
      else selectionHint.textContent = 'Готов режим «2 элемента»: верх + низ.';

      document.querySelectorAll('.product-card').forEach((card) => {
        const item = itemFromPath(card.dataset.category, card.dataset.path);
        const isSelected = selectedTryOn.upper?.path === item.path || selectedTryOn.bottom?.path === item.path;
        card.classList.toggle('selected', isSelected);
      });
    }

    function addToCart(item) {
      if (!cart.some((entry) => entry.path === item.path)) cart.push(item);
      renderCart();
    }

    function removeFromCart(path) {
      const idx = cart.findIndex((entry) => entry.path === path);
      if (idx >= 0) cart.splice(idx, 1);
      renderCart();
    }

    function renderCart() {
      if (!cart.length) {
        cartList.textContent = 'Корзина пуста';
        return;
      }

      cartList.innerHTML = cart.map((item) => `
        <div class="cart-item">
          <span>${item.title}</span>
          <div class="cart-actions">
            <button class="btn btn-primary cart-tryon" data-path="${item.path}">В примерку</button>
            <button class="btn cart-remove" data-path="${item.path}">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    renderCatalog();
    renderSelection();
    renderCart();

    catalogGrid.addEventListener('click', (event) => {
      const card = event.target.closest('.product-card');
      if (!card) return;
      const item = itemFromPath(card.dataset.category, card.dataset.path);

      if (event.target.closest('.select-item')) selectForTryOn(item);
      if (event.target.closest('.add-cart')) addToCart(item);
    });

    cartList.addEventListener('click', (event) => {
      const path = event.target.dataset.path;
      if (!path) return;

      if (event.target.classList.contains('cart-remove')) removeFromCart(path);
      if (event.target.classList.contains('cart-tryon')) {
        const item = cart.find((entry) => entry.path === path);
        if (item) selectForTryOn(item);
      }
    });

    document.getElementById('clearSelection').addEventListener('click', () => {
      selectedTryOn.upper = null;
      selectedTryOn.bottom = null;
      renderSelection();
    });

    const container = document.getElementById('bubbles-container');
    for (let i = 0; i < 42; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 26 + 8;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}vw`;
      bubble.style.animationDuration = `${7 + Math.random() * 14}s`;
      bubble.style.animationDelay = `${Math.random() * 9}s`;
      container.appendChild(bubble);
    }

    const modal = document.getElementById('tryOnModal');
    const startButton = document.getElementById('startTryOn');
    const openTryOn = document.getElementById('openTryOn');
    const closeButton = document.getElementById('closeModal');
    const modePreview = document.getElementById('modePreview');
    const selectionPreview = document.getElementById('selectionPreview');

    function openTryOnModal() {
      const count = [selectedTryOn.upper, selectedTryOn.bottom].filter(Boolean).length;
      if (count === 0) {
        modePreview.textContent = 'Сначала выберите вещи';
        selectionPreview.textContent = 'Пока пусто';
      } else if (count === 1) {
        modePreview.textContent = 'Режим: 1 элемент';
        selectionPreview.textContent = `Выбрано: ${selectedTryOn.upper?.title || selectedTryOn.bottom?.title}`;
      } else {
        modePreview.textContent = 'Режим: 2 элемента';
        selectionPreview.textContent = `Верх: ${selectedTryOn.upper.title}; Низ: ${selectedTryOn.bottom.title}`;
      }
      modal.showModal();
    }

    startButton.addEventListener('click', openTryOnModal);
    openTryOn.addEventListener('click', openTryOnModal);
    closeButton.addEventListener('click', () => modal.close());
    document.getElementById('confirmTryOn').addEventListener('click', () => {
      selectionPreview.textContent = 'Выбор сохранён. Можно подключать примерку API на следующем шаге.';
    });
  </script>
</body>
</html>
